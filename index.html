<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL to QR Code PDF Generator</title>

    <!-- Local Bootstrap -->
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <!-- Local Font Awesome -->
    <link rel="stylesheet" href="css/all.min.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Favicon -->
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon" />
    <!-- App Styles -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ===================== NAVBAR ===================== -->
    <nav class="app-navbar navbar navbar-expand-lg sticky-top">
      <div class="container-fluid px-3 px-md-4">
        <a class="navbar-brand app-brand me-auto" href="#">
          <span class="app-brand-icon"><i class="fa-solid fa-qrcode"></i></span>
          <span class="app-brand-text">QR Code</span>
        </a>

        <div class="d-flex align-items-center gap-2 me-2">
          <button
            type="button"
            class="theme-toggle"
            id="themeToggle"
            aria-label="Toggle dark mode"
          >
            <i class="fa-solid fa-moon" id="themeIcon"></i>
          </button>

          <button
            class="navbar-toggler d-lg-none"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navContent"
            aria-controls="navContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
        </div>

        <div class="collapse navbar-collapse flex-grow-0" id="navContent">
          <div class="auth-container d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center gap-2 mt-3 mt-lg-0 pt-3 pt-lg-0">
            <a href="#" class="btn app-btn-secondary auth-link">Log in</a>
            <a href="#" class="btn app-btn-primary auth-cta">Create account</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- ===================== MAIN ======================= -->
    <main class="app-main">
      <div class="container">
        <div class="text-center hero-copy">
          <h1 class="hero-title">
            Turn any link into a scannable QR code
          </h1>
          <p class="hero-sub">
            Paste a URL, generate a printable QR badge, and download it as a PDF in seconds.
          </p>
        </div>

        <div class="row g-4 app-grid">
          <!-- ============ LEFT COLUMN: CONTROLS ============ -->
          <div class="col-lg-5">
            <div class="app-card controls-card">
              <h2 class="card-heading">
                1. Enter your details
              </h2>

              <form id="qrForm" onsubmit="return false;">
                <!-- URL Input -->
                <div class="mb-3">
                  <label for="urlInput" class="form-label app-label">Destination URL</label>
                  <div class="url-input-wrap">
                    <i class="fa-solid fa-link input-icon"></i>
                    <input
                      type="url"
                      inputmode="url"
                      class="form-control app-input url-input"
                      id="urlInput"
                      placeholder="https://example.com"
                      autocomplete="off"
                    />
                    <button
                      type="button"
                      class="clear-btn"
                      id="clearBtn"
                      aria-label="Clear input"
                    >
                      <i class="fa-solid fa-xmark"></i>
                    </button>
                  </div>
                  <div class="input-hint" id="urlHint">
                    Include http:// or https://
                  </div>
                </div>

                <!-- Dimensions -->
                <div class="row g-3 mb-4">
                  <div class="col-6">
                    <label for="widthInput" class="form-label app-label">Width (px)</label>
                    <input
                      type="number"
                      class="form-control app-input"
                      id="widthInput"
                      value="200"
                      min="80"
                      max="1000"
                      step="10"
                    />
                  </div>
                  <div class="col-6">
                    <label for="heightInput" class="form-label app-label">Height (px)</label>
                    <input
                      type="number"
                      class="form-control app-input"
                      id="heightInput"
                      value="200"
                      min="80"
                      max="1000"
                      step="10"
                    />
                  </div>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex flex-column flex-sm-row gap-3">
                  <button
                    type="button"
                    class="btn app-btn-primary flex-fill"
                    id="generateBtn"
                    disabled
                  >
                    <i class="fa-solid fa-wand-magic-sparkles me-2"></i>
                    <span>Generate QR Code</span>
                  </button>
                  <button
                    type="button"
                    class="btn app-btn-outline flex-fill"
                    id="resetBtn"
                  >
                    <i class="fa-solid fa-rotate-left me-2"></i>
                    <span>Reset</span>
                  </button>
                </div>
              </form>
            </div>
          </div>

          <!-- ============ RIGHT COLUMN: PREVIEW ============ -->
          <div class="col-lg-7">
            <div class="app-card preview-card">
              <h2 class="card-heading">
                2. Preview &amp; export
              </h2>

              <div class="preview-stage" id="previewStage">
                <!-- Placeholder State -->
                <div class="preview-placeholder" id="previewPlaceholder">
                  <div class="placeholder-icon">
                    <i class="fa-solid fa-qrcode"></i>
                  </div>
                  <p class="placeholder-text">
                    Please enter a valid URL and click Generate QR Code
                  </p>
                </div>

                <!-- Generated Badge -->
                <div class="qr-badge d-none" id="qrBadge">
                  <span class="qr-badge-pill">SCAN ME</span>
                  <div class="qr-badge-inner" id="qrCodeCanvas"></div>
                  <div class="qr-badge-footer">
                    <span class="qr-badge-footer-text">SCAN HERE</span>
                  </div>
                </div>
              </div>

              <button
                type="button"
                class="btn app-btn-primary w-100 mt-4"
                id="openPdfBtn"
                disabled
              >
                <i class="fa-solid fa-file-pdf me-2"></i>
                <span>Open PDF</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- ===================== LIBRARIES ===================== -->
    <script src="js/bootstrap.bundle.min.js"></script>
    
    <!-- CDN للمكتبات الجديدة -->
    <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- App Script -->
    <script src="js/main.js"></script>
  </body>
</html>
